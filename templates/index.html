<!DOCTYPE html>
<html>
<head>
    <title>Netflix Real-Time Dashboard</title>

    <!-- Auto refresh every 5 seconds -->
    <meta http-equiv="refresh" content="5">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #141414;
            color: white;
        }

        h1 {
            text-align: center;
            color: #e50914;
            padding: 20px;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .cards {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .card {
            background: #1f1f1f;
            padding: 20px;
            margin: 10px;
            border-radius: 12px;
            width: 200px;
            text-align: center;
        }

        .graphs {
            text-align: center;
        }

        .graphs img {
            width: 80%;
            margin: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🎬 Netflix Real-Time Dashboard</h1>

    <div class="container">

        <!-- Cards -->
        <div class="cards">
            <div class="card">
                <h2>Total</h2>
                <p>{{ total }}</p>
            </div>

            <div class="card">
                <h2>Movies</h2>
                <p>{{ movies }}</p>
            </div>

            <div class="card">
                <h2>TV Shows</h2>
                <p>{{ shows }}</p>
            </div>

            <div class="card">
                <h2>Avg Year</h2>
                <p>{{ avg_year }}</p>
            </div>
        </div>

        <!-- Graphs -->
        <div class="graphs">
            <h2>📊 Live Visualizations (updates every 5 seconds)</h2>

            <h3>Movies vs TV Shows</h3>
            <img src="{{ url_for('static', filename='bar.png') }}">

            <h3>Release Year Distribution</h3>
            <img src="{{ url_for('static', filename='scatter.png') }}">

            <h3>Heatmap</h3>
            <img src="{{ url_for('static', filename='heatmap.png') }}">
        </div>

    </div>

</body>
</html>
